name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch: {}

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    lint:
        name: Lint + composer validate/audit (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        continue-on-error: ${{ matrix.php == '8.5' }}
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ matrix.php }}-
            - name: Validate composer.json
              run: composer validate --strict --no-interaction
            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist
            - name: PHP syntax check
              run: composer lint --no-interaction
            - name: Audit direct + transitive dependencies
              run: composer audit --abandoned=ignore --no-interaction

    cgl:
        name: Coding standards (dry-run)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-8.4-${{ hashFiles('composer.json') }}
                  restore-keys: composer-8.4-
            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist
            - name: TYPO3 coding standards
              run: composer cs:check --no-interaction

    phpstan:
        # Policy: the "normal" static-analysis gate is PHPStan level 8 or
        # higher. phpstan.neon runs at level max, which satisfies that.
        name: PHPStan (level max, policy minimum level 8)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-8.4-${{ hashFiles('composer.json') }}
                  restore-keys: composer-8.4-
            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist
            - name: PHPStan
              run: composer phpstan --no-interaction -- --no-progress --error-format=github

    unit:
        name: Unit tests (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        continue-on-error: ${{ matrix.php == '8.5' }}
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ matrix.php }}-
            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist
            - name: PHPUnit unit suite
              run: Build/Scripts/runTests.sh -s unit

    functional:
        name: Functional tests (PHP ${{ matrix.php }}, MariaDB 10.11)
        runs-on: ubuntu-latest
        needs: [unit]
        continue-on-error: ${{ matrix.php == '8.5' }}
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        services:
            mariadb:
                image: mariadb:10.11
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: typo3_test
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mariadb-admin ping -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        env:
            typo3DatabaseDriver: mysqli
            typo3DatabaseHost: 127.0.0.1
            typo3DatabasePort: 3306
            typo3DatabaseUsername: root
            typo3DatabasePassword: root
            typo3DatabaseName: typo3_test
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ matrix.php }}-
            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist
            - name: PHPUnit functional suite
              run: Build/Scripts/runTests.sh -s functional

    architecture:
        name: Architecture rules (phpat)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-8.4-${{ hashFiles('composer.json') }}
                  restore-keys: composer-8.4-
            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist
            - name: phpat layering rules
              run: Build/Scripts/runTests.sh -s architecture
