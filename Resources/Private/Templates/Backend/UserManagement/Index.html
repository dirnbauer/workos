<html
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="workos_auth.messages:module.users.title" /></h1>
    <p><f:translate key="workos_auth.messages:module.users.description" /></p>

    <f:if condition="{status.canLoadWidget}">
        <f:then>
            <div
                class="workos-user-management"
                data-workos-user-management-mount
                data-token-uri="{tokenUri}"
                data-request-token="{tokenRequestTokenValue}"
                aria-live="polite"
            >
                <p class="workos-user-management-loading">
                    <core:icon identifier="spinner-circle" size="small" />
                    <f:translate key="workos_auth.messages:module.users.loading" />
                </p>
            </div>
            <p class="text-variant"><small><f:translate key="workos_auth.messages:module.users.footerNote" /></small></p>
        </f:then>
        <f:else if="{status.workosUserId}">
            <f:be.infobox
                title="{f:translate(key: 'workos_auth.messages:module.users.join.title')}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
            >
                <f:translate key="workos_auth.messages:module.users.join.intro" />
            </f:be.infobox>

            <div class="card-container">
                <f:if condition="{availableOrganizations -> f:count()}">
                    <div class="card card-size-medium">
                        <div class="card-header">
                            <div class="card-icon"><core:icon identifier="actions-users" size="medium" /></div>
                            <div class="card-header-body">
                                <h2 class="card-title"><f:translate key="workos_auth.messages:module.users.join.existing.title" /></h2>
                            </div>
                        </div>
                        <form method="post" action="{joinUri}">
                            <input type="hidden" name="{requestTokenName}" value="{joinRequestTokenValue}" />
                            <div class="card-body">
                                <f:if condition="{availableOrganizations -> f:count()} > 1">
                                    <f:then>
                                        <div class="form-group">
                                            <label class="form-label" for="workos-org-select"><f:translate key="workos_auth.messages:module.users.join.existing.label" /></label>
                                            <select id="workos-org-select" name="organizationId" class="form-select" required>
                                                <f:for each="{availableOrganizations}" as="organization">
                                                    <option value="{organization.id}">{organization.name}</option>
                                                </f:for>
                                            </select>
                                        </div>
                                    </f:then>
                                    <f:else>
                                        <f:for each="{availableOrganizations}" as="organization">
                                            <p><f:translate key="workos_auth.messages:module.users.join.existing.single" arguments="{organization: organization.name}" /></p>
                                            <input type="hidden" name="organizationId" value="{organization.id}" />
                                        </f:for>
                                    </f:else>
                                </f:if>
                            </div>
                            <div class="card-footer">
                                <f:if condition="{availableOrganizations -> f:count()} > 1">
                                    <f:then>
                                        <button type="submit" class="btn btn-primary"><f:translate key="workos_auth.messages:module.users.join.existing.submit" /></button>
                                    </f:then>
                                    <f:else>
                                        <f:for each="{availableOrganizations}" as="organization">
                                            <button type="submit" class="btn btn-primary"><f:translate key="workos_auth.messages:module.users.join.existing.singleSubmit" arguments="{organization: organization.name}" /></button>
                                        </f:for>
                                    </f:else>
                                </f:if>
                            </div>
                        </form>
                    </div>
                </f:if>

                <div class="card card-size-medium">
                    <div class="card-header">
                        <div class="card-icon"><core:icon identifier="actions-plus" size="medium" /></div>
                        <div class="card-header-body">
                            <h2 class="card-title"><f:translate key="workos_auth.messages:module.users.create.title" /></h2>
                        </div>
                    </div>
                    <form method="post" action="{createOrgUri}">
                        <input type="hidden" name="{requestTokenName}" value="{createOrganizationRequestTokenValue}" />
                        <div class="card-body">
                            <p><f:translate key="workos_auth.messages:module.users.create.intro" /></p>
                            <div class="form-group">
                                <label class="form-label" for="workos-org-name"><f:translate key="workos_auth.messages:module.users.create.label" /></label>
                                <input id="workos-org-name" name="name" type="text" class="form-control" value="{suggestedOrganizationName}" required />
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-default"><f:translate key="workos_auth.messages:module.users.create.submit" /></button>
                        </div>
                    </form>
                </div>
            </div>

            <p>
                <f:translate key="workos_auth.messages:module.users.join.advancedHint" />
                <a href="{setupUri}"><f:translate key="workos_auth.messages:module.users.cta.openSetup" /></a>
            </p>
        </f:else>
        <f:else if="{status.needsWorkosLogin}">
            <f:be.infobox
                title="{status.message}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
            >
                <p><f:translate key="workos_auth.messages:module.users.noWorkosSession.description" /></p>
                <p>
                    <a href="{workosLoginUri}" class="btn btn-primary">
                        <core:icon identifier="actions-login" size="small" />
                        <f:translate key="workos_auth.messages:module.users.noWorkosSession.action" />
                    </a>
                </p>
                <p class="mb-0"><f:translate key="workos_auth.messages:module.users.noWorkosSession.hint" /></p>
            </f:be.infobox>
        </f:else>
        <f:else>
            <f:be.infobox
                title="{status.message}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
            >
                <f:if condition="{configured}">
                    <f:else>
                        <a href="{setupUri}" class="btn btn-default"><f:translate key="workos_auth.messages:module.users.cta.openSetup" /></a>
                    </f:else>
                </f:if>
            </f:be.infobox>
        </f:else>
    </f:if>
</f:section>

</html>
