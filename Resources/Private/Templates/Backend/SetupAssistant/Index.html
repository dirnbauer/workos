<html
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="workos_auth.messages:setup.title" /></h1>
    <p><f:translate key="workos_auth.messages:setup.intro" /></p>

    <f:if condition="{errors}">
        <f:then>
            <f:be.infobox
                title="{f:translate(key: 'workos_auth.messages:setup.status.notReady')}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
            >
                <ul class="mb-0">
                    <f:for each="{errors}" as="error"><li>{error}</li></f:for>
                </ul>
            </f:be.infobox>
        </f:then>
        <f:else>
            <f:be.infobox
                title="{f:translate(key: 'workos_auth.messages:setup.status.ready')}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::OK')}"
            >
                <f:translate key="workos_auth.messages:setup.status.ready.description" />
            </f:be.infobox>
        </f:else>
    </f:if>

    <h2><f:translate key="workos_auth.messages:setup.redirectUrls.title" /></h2>
    <p><f:translate key="workos_auth.messages:setup.redirectUrls.description" /></p>
    <div class="table-fit">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th scope="col"><f:translate key="workos_auth.messages:setup.redirectUrls.where" /></th>
                    <th scope="col"><f:translate key="workos_auth.messages:setup.redirectUrls.uri" /></th>
                    <th scope="col" class="col-control"><span class="visually-hidden"><f:translate key="workos_auth.messages:setup.redirectUrls.copy" /></span></th>
                </tr>
            </thead>
            <tbody>
                <f:for each="{redirectUris}" as="redirectUri">
                    <tr>
                        <td>{redirectUri.label}</td>
                        <td><code>{redirectUri.url}</code></td>
                        <td class="col-control">
                            <typo3-copy-to-clipboard
                                text="{redirectUri.url}"
                                class="btn btn-default btn-sm"
                                title="{f:translate(key: 'workos_auth.messages:setup.redirectUrls.copyOne', arguments: {where: redirectUri.label})}"
                            >
                                <core:icon identifier="actions-clipboard" size="small" />
                            </typo3-copy-to-clipboard>
                        </td>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </div>
    <p>
        <typo3-copy-to-clipboard text="{allRedirectUris}" class="btn btn-default">
            <core:icon identifier="actions-clipboard" size="small" />
            <f:translate key="workos_auth.messages:setup.redirectUrls.copyAll" />
        </typo3-copy-to-clipboard>
    </p>
    <f:be.infobox
        title="{f:translate(key: 'workos_auth.messages:setup.redirectUrls.whereToAdd')}"
        state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
    >
        <ol class="mb-0">
            <li><f:translate key="workos_auth.messages:setup.redirectUrls.instruction.openDashboard" /></li>
            <li><f:translate key="workos_auth.messages:setup.redirectUrls.instruction.addUrls" /></li>
            <li><f:translate key="workos_auth.messages:setup.redirectUrls.instruction.saveChanges" /></li>
        </ol>
    </f:be.infobox>

    <form id="{formId}" method="post" action="{saveUri}" novalidate>
        <input type="hidden" name="{requestTokenName}" value="{requestTokenValue}" />

        <h2><f:translate key="workos_auth.messages:setup.credentials.title" /></h2>
        <div class="row">
            <div class="col-md">
            <div class="form-group{f:if(condition: errors.apiKey, then: ' has-error')}">
                <label class="form-label" for="apiKey"><f:translate key="workos_auth.messages:setup.credentials.apiKey" /></label>
                <input
                    id="apiKey"
                    class="form-control"
                    type="password"
                    name="configuration[apiKey]"
                    value=""
                    autocomplete="new-password"
                    spellcheck="false"
                    placeholder="{apiKeyHint}"
                    aria-invalid="{f:if(condition: errors.apiKey, then: 'true', else: 'false')}"
                    aria-describedby="apiKey-description"
                />
                <f:if condition="{errors.apiKey}">
                    <div class="form-text"><strong>{errors.apiKey}</strong></div>
                </f:if>
                <div class="form-text" id="apiKey-description">
                    <f:if condition="{apiKeyStored}">
                        <f:then><f:translate key="workos_auth.messages:setup.credentials.apiKey.stored" /></f:then>
                        <f:else><f:translate key="workos_auth.messages:setup.credentials.apiKey.missing" /></f:else>
                    </f:if>
                </div>
            </div>
            </div>
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'clientId', label: 'setup.credentials.clientId', description: 'setup.credentials.clientId.description', value: formValues.clientId, error: errors.clientId, placeholder: 'client_…'}" /></div>
        </div>

        <h2><f:translate key="workos_auth.messages:setup.frontend.title" /></h2>
        <f:render partial="Backend/Field" section="Switch" arguments="{name: 'frontendEnabled', label: 'setup.frontend.enable', description: 'setup.frontend.enable.description', checked: formValues.frontendEnabled}" />
        <f:render partial="Backend/Field" section="Switch" arguments="{name: 'frontendAutoCreateUsers', label: 'setup.frontend.autoCreate', description: 'setup.frontend.autoCreate.description', checked: formValues.frontendAutoCreateUsers}" />
        <f:render partial="Backend/Field" section="Switch" arguments="{name: 'frontendLinkByEmail', label: 'setup.frontend.linkByEmail', description: 'setup.frontend.linkByEmail.description', checked: formValues.frontendLinkByEmail}" />
        <div class="row">
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'frontendStoragePid', label: 'setup.frontend.storagePid', description: 'setup.frontend.storagePid.description', value: formValues.frontendStoragePid, error: errors.frontendStoragePid, type: 'number', min: '0', inputmode: 'numeric'}" /></div>
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'frontendDefaultGroupUids', label: 'setup.frontend.defaultGroupUids', description: 'setup.frontend.defaultGroupUids.description', value: formValues.frontendDefaultGroupUids}" /></div>
        </div>
        <div class="row">
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'frontendLoginPath', label: 'setup.frontend.loginPath', description: 'setup.frontend.loginPath.description', value: formValues.frontendLoginPath}" /></div>
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'frontendCallbackPath', label: 'setup.frontend.callbackPath', description: 'setup.frontend.callbackPath.description', value: formValues.frontendCallbackPath}" /></div>
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'frontendLogoutPath', label: 'setup.frontend.logoutPath', description: 'setup.frontend.logoutPath.description', value: formValues.frontendLogoutPath}" /></div>
        </div>
        <f:render partial="Backend/Field" section="Text" arguments="{name: 'frontendSuccessRedirect', label: 'setup.frontend.successRedirect', description: 'setup.frontend.successRedirect.description', value: formValues.frontendSuccessRedirect}" />

        <h2><f:translate key="workos_auth.messages:setup.backend.title" /></h2>
        <f:render partial="Backend/Field" section="Switch" arguments="{name: 'backendEnabled', label: 'setup.backend.enable', description: 'setup.backend.enable.description', checked: formValues.backendEnabled}" />
        <f:if condition="{formValues.backendEnabled}">
            <f:if condition="{backendCookieSameSiteCompatible}">
                <f:else>
                    <f:be.infobox state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}">
                        <f:translate key="workos_auth.messages:setup.backend.cookieSameSiteUnsupported" arguments="{sameSite: backendCookieSameSite}" />
                    </f:be.infobox>
                </f:else>
            </f:if>
        </f:if>
        <f:render partial="Backend/Field" section="Switch" arguments="{name: 'backendAutoCreateUsers', label: 'setup.backend.autoCreate', description: 'setup.backend.autoCreate.description', checked: formValues.backendAutoCreateUsers}" />
        <f:render partial="Backend/Field" section="Switch" arguments="{name: 'backendLinkByEmail', label: 'setup.backend.linkByEmail', description: 'setup.backend.linkByEmail.description', checked: formValues.backendLinkByEmail}" />
        <div class="row">
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'backendDefaultGroupUids', label: 'setup.backend.defaultGroupUids', description: 'setup.backend.defaultGroupUids.description', value: formValues.backendDefaultGroupUids, error: errors.backendDefaultGroupUids}" /></div>
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'backendAllowedDomains', label: 'setup.backend.allowedDomains', description: 'setup.backend.allowedDomainsHint', value: formValues.backendAllowedDomains, placeholder: 'example.com'}" /></div>
        </div>
        <f:render partial="Backend/Field" section="Switch" arguments="{name: 'widgetCorsAutoRegister', label: 'setup.backend.widgetCorsAutoRegister', description: 'setup.backend.widgetCorsAutoRegister.description', checked: formValues.widgetCorsAutoRegister}" />
        <f:render partial="Backend/Field" section="Text" arguments="{name: 'widgetCorsOrigins', label: 'setup.backend.widgetCorsOrigins', description: 'setup.backend.widgetCorsOrigins.description', value: formValues.widgetCorsOrigins, placeholder: 'https://example.com'}" />
        <div class="row">
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'backendLoginPath', label: 'setup.backend.loginPath', description: 'setup.backend.loginPath.description', value: formValues.backendLoginPath}" /></div>
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'backendCallbackPath', label: 'setup.backend.callbackPath', description: 'setup.backend.callbackPath.description', value: formValues.backendCallbackPath}" /></div>
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'backendSuccessPath', label: 'setup.backend.successPath', description: 'setup.backend.successPath.description', value: formValues.backendSuccessPath}" /></div>
        </div>

        <h2><f:translate key="workos_auth.messages:setup.authkit.title" /></h2>
        <p><f:translate key="workos_auth.messages:setup.authkit.description" /></p>
        <div class="row">
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'authkitOrganizationId', label: 'setup.authkit.organizationId', description: 'setup.authkit.organizationId.description', value: formValues.authkitOrganizationId, placeholder: 'org_…'}" /></div>
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'authkitConnectionId', label: 'setup.authkit.connectionId', description: 'setup.authkit.connectionId.description', value: formValues.authkitConnectionId, placeholder: 'conn_…'}" /></div>
            <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'authkitDomainHint', label: 'setup.authkit.domainHint', description: 'setup.authkit.domainHint.description', value: formValues.authkitDomainHint, placeholder: 'example.com'}" /></div>
        </div>

        <p>
            <f:translate key="workos_auth.messages:setup.mcpHint" />
            <a href="{mcpUri}"><f:translate key="workos_auth.messages:module.mcp.title" /></a>
        </p>
    </form>
</f:section>

</html>
