<html
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="workos_auth.messages:module.mcp.title" /></h1>
    <p><f:translate key="workos_auth.messages:module.mcp.description" /></p>

    <f:if condition="{status.ready}">
        <f:then>
            <f:be.infobox
                title="{f:translate(key: 'workos_auth.messages:module.mcp.ready.title')}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::OK')}"
            >
                <f:translate key="workos_auth.messages:module.mcp.ready.description" />
            </f:be.infobox>
        </f:then>
        <f:else>
            <f:be.infobox
                title="{f:translate(key: 'workos_auth.messages:module.mcp.notReady.title')}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
            >
                <f:translate key="workos_auth.messages:module.mcp.notReady.description" />
            </f:be.infobox>
        </f:else>
    </f:if>

    <div class="table-fit">
        <table class="table table-striped">
            <caption class="visually-hidden"><f:translate key="workos_auth.messages:module.mcp.status.caption" /></caption>
            <tbody>
                <tr>
                    <th scope="row"><f:translate key="workos_auth.messages:module.mcp.status.context" /></th>
                    <td><code>{status.context}</code></td>
                </tr>
                <tr>
                    <th scope="row"><f:translate key="workos_auth.messages:module.mcp.status.endpoint" /></th>
                    <td>
                        <f:if condition="{status.enabled}">
                            <f:then><span class="badge badge-success"><f:translate key="workos_auth.messages:module.mcp.status.enabled" /></span></f:then>
                            <f:else><span class="badge badge-default"><f:translate key="workos_auth.messages:module.mcp.status.disabled" /></span></f:else>
                        </f:if>
                    </td>
                </tr>
                <tr>
                    <th scope="row"><f:translate key="workos_auth.messages:module.mcp.status.auth" /></th>
                    <td>
                        <f:if condition="{status.workosRequired}">
                            <f:then><span class="badge badge-info"><f:translate key="workos_auth.messages:module.mcp.status.workosRequired" /></span></f:then>
                            <f:else><span class="badge badge-warning"><f:translate key="workos_auth.messages:module.mcp.status.anonymous" /></span></f:else>
                        </f:if>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="row">
        <div class="col-xl-7">
            <form id="{formId}" method="post" action="{saveUri}" novalidate>
                <input type="hidden" name="{requestTokenName}" value="{requestTokenValue}" />

                <h2><f:translate key="workos_auth.messages:module.mcp.section.endpoint" /></h2>
                <f:render partial="Backend/Field" section="Switch" arguments="{name: 'mcpEnabled', label: 'setup.mcp.enable', description: 'setup.mcp.enable.description', checked: formValues.mcpEnabled}" />
                <div class="row">
                    <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'mcpServerPath', label: 'setup.mcp.serverPath', description: 'setup.mcp.serverPath.description', value: formValues.mcpServerPath}" /></div>
                    <div class="col-md"><f:render partial="Backend/Field" section="Text" arguments="{name: 'mcpServerLimit', label: 'setup.mcp.serverLimit', description: 'setup.mcp.serverLimit.description', value: formValues.mcpServerLimit, type: 'number', min: '1', max: '10', inputmode: 'numeric'}" /></div>
                </div>

                <h2><f:translate key="workos_auth.messages:module.mcp.section.security" /></h2>
                <div class="form-group{f:if(condition: errors.mcpAuthenticationMode, then: ' has-error')}">
                    <label class="form-label" for="mcpAuthenticationMode"><f:translate key="workos_auth.messages:setup.mcp.authenticationMode" /></label>
                    <select id="mcpAuthenticationMode" class="form-select" name="configuration[mcpAuthenticationMode]" aria-describedby="mcpAuthenticationMode-description">
                        <f:for each="{modeOptions}" as="option">
                            <option value="{option.value}" {f:if(condition: option.selected, then: 'selected') -> f:format.raw()}>{option.label}</option>
                        </f:for>
                    </select>
                    <f:if condition="{errors.mcpAuthenticationMode}">
                        <div class="form-text"><strong>{errors.mcpAuthenticationMode}</strong></div>
                    </f:if>
                    <div class="form-text" id="mcpAuthenticationMode-description">
                        <ul class="mb-0">
                            <f:for each="{modeOptions}" as="option"><li><strong>{option.label}:</strong> {option.description}</li></f:for>
                        </ul>
                    </div>
                </div>
                <f:render partial="Backend/Field" section="Text" arguments="{name: 'mcpAuthkitDomain', label: 'setup.mcp.authkitDomain', description: 'setup.mcp.authkitDomain.description', value: formValues.mcpAuthkitDomain, error: errors.mcpAuthkitDomain, type: 'url', placeholder: 'https://your-project.authkit.app'}" />
                <f:render partial="Backend/Field" section="Switch" arguments="{name: 'mcpVerboseLogging', label: 'setup.mcp.verboseLogging', description: 'setup.mcp.verboseLogging.description', checked: formValues.mcpVerboseLogging}" />

                <h2><f:translate key="workos_auth.messages:module.mcp.section.workos" /></h2>
                <f:render partial="Backend/Field" section="Switch" arguments="{name: 'mcpWorkosDiscovery', label: 'setup.mcp.workosDiscovery', description: 'setup.mcp.workosDiscovery.description', checked: formValues.mcpWorkosDiscovery}" />
            </form>
        </div>

        <div class="col-xl-5">
            <div class="card">
                <div class="card-header">
                    <div class="card-icon"><core:icon identifier="actions-database" size="medium" /></div>
                    <div class="card-header-body">
                        <h2 class="card-title"><f:translate key="workos_auth.messages:module.mcp.schema.title" /></h2>
                        <span class="card-subtitle">
                            <f:if condition="{databaseSchema.ready}">
                                <f:then><span class="badge badge-success"><f:translate key="workos_auth.messages:module.mcp.schema.ready" /></span></f:then>
                                <f:else><span class="badge badge-warning"><f:translate key="workos_auth.messages:module.mcp.schema.pending" /></span></f:else>
                            </f:if>
                        </span>
                    </div>
                </div>
                <div class="card-body">
                    <p>
                        <f:translate key="workos_auth.messages:module.mcp.schema.tables" />
                        <f:for each="{databaseSchema.managedTables}" as="tableName" iteration="iterator">
                            <code>{tableName}</code>{f:if(condition: iterator.isLast, else: ', ')}
                        </f:for>
                    </p>
                    <f:if condition="{databaseSchema.error}">
                        <f:then>
                            <f:be.infobox state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::ERROR')}">{databaseSchema.error}</f:be.infobox>
                        </f:then>
                        <f:else if="{databaseSchema.ready}">
                            <p class="mb-0"><f:translate key="workos_auth.messages:module.mcp.schema.ready.description" /></p>
                        </f:else>
                        <f:else>
                            <p><f:translate key="workos_auth.messages:module.mcp.schema.pending.description" /></p>
                            <form method="post" action="{schemaUri}">
                                <input type="hidden" name="{requestTokenName}" value="{requestTokenValue}" />
                                <button class="btn btn-default" type="submit">
                                    <core:icon identifier="actions-database-import" size="small" />
                                    <f:translate key="workos_auth.messages:module.mcp.schema.apply" />
                                </button>
                            </form>
                        </f:else>
                    </f:if>
                </div>
            </div>

            <h2><f:translate key="workos_auth.messages:module.mcp.checklist.title" /></h2>
            <ol>
                <li><f:translate key="workos_auth.messages:module.mcp.checklist.endpoint" /></li>
                <li><f:translate key="workos_auth.messages:module.mcp.checklist.authkit" /></li>
                <li><f:translate key="workos_auth.messages:module.mcp.checklist.mapping" /></li>
                <li><f:translate key="workos_auth.messages:module.mcp.checklist.client" /></li>
            </ol>
        </div>
    </div>

    <h2><f:translate key="workos_auth.messages:module.mcp.endpoints.title" /></h2>
    <div class="table-fit">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th scope="col"><f:translate key="workos_auth.messages:module.mcp.endpoints.label" /></th>
                    <th scope="col"><f:translate key="workos_auth.messages:module.mcp.endpoints.url" /></th>
                    <th scope="col" class="col-control"><span class="visually-hidden"><f:translate key="workos_auth.messages:setup.redirectUrls.copy" /></span></th>
                </tr>
            </thead>
            <tbody>
                <f:for each="{endpointUrls}" as="endpointSet">
                    <f:render section="EndpointRow" arguments="{label: endpointSet.label, url: endpointSet.endpoint, strong: 1}" />
                    <f:render section="EndpointRow" arguments="{label: '{f:translate(key: \'workos_auth.messages:module.mcp.endpoints.protectedResource\')}', url: endpointSet.protectedResource}" />
                    <f:render section="EndpointRow" arguments="{label: '{f:translate(key: \'workos_auth.messages:module.mcp.endpoints.authorizationServer\')}', url: endpointSet.authorizationServer}" />
                </f:for>
            </tbody>
        </table>
    </div>
</f:section>

<f:section name="EndpointRow">
    <tr>
        <td><f:if condition="{strong}"><f:then><strong>{label}</strong></f:then><f:else>{label}</f:else></f:if></td>
        <td><code>{url}</code></td>
        <td class="col-control">
            <typo3-copy-to-clipboard
                text="{url}"
                class="btn btn-default btn-sm"
                title="{f:translate(key: 'workos_auth.messages:setup.redirectUrls.copyOne', arguments: {where: label})}"
            >
                <core:icon identifier="actions-clipboard" size="small" />
            </typo3-copy-to-clipboard>
        </td>
    </tr>
</f:section>

</html>
